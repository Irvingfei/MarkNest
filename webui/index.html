<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MarkNest</title>
<!-- Version query parameters prevent stale caches after an app upgrade. The
     TOS WebView caches same-URL assets hard, so a change without a version bump
     never reaches the user. tools/bump_version.py rewrites every one of these
     from the VERSION file, and validate.py fails the submission if any of them
     drifts or if they disagree with each other. -->
<script src="js/theme-boot.js?v=1.1.013"></script>
<link rel="stylesheet" href="css/style.css?v=1.1.013">
</head>

<div class="app" id="app">

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <a class="brand" href="#/library" aria-label="MarkNest">
        <img class="brand-mark" src="icons/marknest.svg" alt="" aria-hidden="true">
        <span class="brand-text">
          <span class="brand-name" data-i18n="app.name">MarkNest</span>
          <span class="brand-sub" data-i18n="app.subtitle">NAS 上的 Markdown 笔记库</span>
        </span>
      </a>
      <span class="app-version" id="app-version" title="MarkNest for TOS">v1.1.013</span>
      <button type="button" class="icon-btn collapse-btn" id="btn-collapse"
              data-i18n-title="nav.collapse" data-i18n-aria-label="nav.collapse"
              title="收起侧栏" aria-label="收起侧栏">
        <svg class="icon" aria-hidden="true"><use href="#i-panel"></use></svg>
      </button>
    </div>

    <button type="button" class="search-trigger" id="btn-search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <span class="search-trigger-label" data-i18n="shell.searchHint">搜索</span>
      <kbd class="search-trigger-kbd">Ctrl K</kbd>
    </button>

    <nav class="nav" id="nav" aria-label="MarkNest">
      <a class="nav-item" href="#/library" data-route="library">
        <svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg>
        <span data-i18n="nav.library">文档库</span>
      </a>
      <a class="nav-item" href="#/import" data-route="import">
        <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg>
        <span data-i18n="nav.import">上传导入</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
        <svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>
        <span data-i18n="nav.settings">个人中心</span>
      </a>
    </nav>

    <section class="side-panel" id="side-folders">
      <header class="side-head">
        <span class="side-title" data-i18n="nav.foldersSection">文件夹</span>
        <button type="button" class="icon-btn icon-btn-sm" id="btn-new-folder"
                data-i18n-title="nav.newFolder" data-i18n-aria-label="nav.newFolder"
                title="新建文件夹" aria-label="新建文件夹">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </header>
      <div class="folder-list" id="folder-list"></div>
    </section>

    <div class="side-foot">
      <div class="storage-card">
        <div class="storage-head">
          <span class="storage-label" data-i18n="nav.storage">存储空间</span>
          <span class="storage-value" id="storage-text">—</span>
        </div>
        <div class="meter" role="presentation"><span class="meter-fill" id="storage-bar"></span></div>
        <div class="conn">
          <span class="conn-dot" id="conn-dot" aria-hidden="true"></span>
          <span class="conn-text" id="conn-text"></span>
        </div>
      </div>
      <button type="button" class="user-chip" id="user-chip">
        <span class="avatar" id="user-avatar">M</span>
        <span class="user-meta">
          <span class="user-name" id="user-name">…</span>
          <span class="user-note" data-i18n="shell.footerNote">文件保存在你的 NAS 上</span>
        </span>
        <svg class="icon user-chevron" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </button>
    </div>
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator"
         aria-orientation="vertical" tabindex="0"
         data-i18n-title="nav.resizeSidebar" data-i18n-aria-label="nav.resizeSidebar"
         title="拖动调整侧栏宽度" aria-label="拖动调整侧栏宽度"></div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn only-narrow" id="btn-menu"
              data-i18n-title="nav.menu" data-i18n-aria-label="nav.menu"
              title="打开菜单" aria-label="打开菜单">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
      <nav class="crumb" id="crumb" aria-label="breadcrumb"></nav>
      <div class="topbar-actions" id="topbar-actions"></div>
      <button type="button" class="icon-btn theme-btn" id="btn-theme"
              data-i18n-title="shell.themeToggle" data-i18n-aria-label="shell.themeToggle"
              title="切换主题" aria-label="切换主题">
        <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

</div>

<div class="overlay-root" id="overlay-root"></div>
<div class="toast-host" id="toast-host" aria-live="polite"></div>
