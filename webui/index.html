<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MarkNest</title>
<!-- Version query parameters prevent stale caches after an app upgrade. The
     TOS WebView caches same-URL assets hard, so a change without a version bump
     never reaches the user. tools/bump_version.py rewrites every one of these
     from the VERSION file, and validate.py fails the submission if any of them
     drifts or if they disagree with each other. -->
<link rel="stylesheet" href="css/style.css?v=1.0.2">
</head>
<body>

<!-- The tab strip is a row of controls, not a stretched bar: the host paints
     its own window buttons over the right-hand end of the frame, so anything
     reaching that edge is both unclickable and wrong-looking. The top padding
     clears the host's full-width drag band for the same reason. -->
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="icons/marknest.svg" alt="" aria-hidden="true">
      <span class="brand-title" data-i18n="app.name">MarkNest 笔记</span>
      <span class="app-version" id="app-version" title="MarkNest for TOS">v1.0.2</span>
    </div>

    <nav class="actions" id="topbar-actions">
      <button type="button" class="btn btn-icon" id="btn-new-note"
              data-i18n-title="tree.newNoteTitle" title="新建笔记">
        <span aria-hidden="true">＋</span>
      </button>
      <button type="button" class="btn" id="btn-save" disabled
              data-i18n="editor.save">保存</button>
      <button type="button" class="btn" id="btn-preview-toggle" aria-pressed="true"
              data-i18n="editor.togglePreview">预览</button>
    </nav>

    <div class="current-note">
      <span class="current-path" id="current-path" data-i18n="editor.noNote">未打开笔记</span>
      <span class="dirty-dot" id="dirty-dot" hidden aria-hidden="true"></span>
    </div>

    <div class="topbar-tail">
      <label class="lang-label" for="lang-select" data-i18n="common.language">语言</label>
      <select id="lang-select" class="lang-select"></select>
    </div>
  </header>

  <!-- role="toolbar" conventionally implies arrow-key navigation between the
       items, which is not implemented: the buttons are reachable by Tab and
       carry real accessible names, but there is no roving tabindex. The role
       is kept because the bar is one, and the gap is recorded here so it reads
       as a known limitation rather than an oversight. -->
  <div class="format-bar" id="format-bar" role="toolbar" hidden
       data-i18n-aria-label="format.ariaLabel" aria-label="Formatting"></div>

  <main class="workspace" id="workspace">

    <aside class="pane pane-tree" id="pane-tree"
           data-i18n-aria-label="tree.ariaLabel" aria-label="Note tree">
      <div class="pane-head">
        <input type="search" class="search-box" id="search-box"
               data-i18n-placeholder="search.placeholder" placeholder="搜索笔记…"
               autocomplete="off">
        <button type="button" class="btn btn-sm" id="btn-refresh-tree"
                data-i18n-title="tree.refreshTitle" title="刷新">⟳</button>
      </div>
      <div class="pane-body" id="tree-body"></div>
      <div class="pane-foot" id="tree-footer"></div>
    </aside>

    <div class="splitter" id="splitter-left" role="separator" aria-orientation="vertical" tabindex="0"></div>

    <section class="pane pane-editor" id="pane-editor"
             data-i18n-aria-label="editor.ariaLabel" aria-label="Editor">
      <div class="pane-head">
        <span class="pane-title" id="editor-title" data-i18n="editor.title">编辑</span>
      </div>
      <div class="editor-host" id="editor-host"></div>
      <div class="pane-foot" id="editor-footer"></div>
    </section>

    <div class="splitter" id="splitter-right" role="separator" aria-orientation="vertical" tabindex="0"></div>

    <section class="pane pane-preview" id="pane-preview"
             data-i18n-aria-label="preview.ariaLabel" aria-label="Preview">
      <div class="pane-head">
        <span class="pane-title" data-i18n="preview.title">预览</span>
      </div>
      <div class="markdown-body" id="preview-body"></div>
    </section>

  </main>

  <div class="home" id="home" hidden>
    <div class="home-actions">
      <button type="button" class="home-btn" id="home-open"
              data-i18n="home.open">打开文件</button>
      <button type="button" class="home-btn home-btn-primary" id="home-new"
              data-i18n="home.new">新建文件</button>
    </div>
    <div class="home-recent" id="home-recent"></div>
  </div>

  <footer class="statusbar">
    <span class="status" id="status-text"></span>
    <span class="status-sep" aria-hidden="true">·</span>
    <span class="status" id="index-status"></span>
  </footer>

</div>

<div class="toast-host" id="toast-host" aria-live="polite"></div>

<script src="js/i18n.js?v=1.0.2"></script>
<script src="js/ui.js?v=1.0.2"></script>
<script src="js/mdcmd.js?v=1.0.2"></script>
<script src="js/api.js?v=1.0.2"></script>
<script src="js/toshost.js?v=1.0.2"></script>
<script src="js/vendor.editor.js?v=1.0.2"></script>
<script src="js/formatbar.js?v=1.0.2"></script>
<script src="js/treepane.js?v=1.0.2"></script>
<script src="js/editorpane.js?v=1.0.2"></script>
<script src="js/previewpane.js?v=1.0.2"></script>
<script src="js/searchpane.js?v=1.0.2"></script>
<script src="js/app.js?v=1.0.2"></script>
</body>
</html>
